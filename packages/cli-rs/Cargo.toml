[package]
name = "reppit-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native CLI for community-ranked repos and agent skills"

[[bin]]
name = "reppit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
axum = "0.8"
