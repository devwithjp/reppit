name: Refresh reppit index

on:
  schedule:
    - cron: "37 15 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ce8d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d6488b4475f1b65c8bd8f7450c9f8514c2f7d7e
        with:
          version: 12.15.0
      - uses: actions/setup-node@1e60f620b9541d2fe8136e7701026b1b59f81c0d
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh repository signals
        run: pnpm --filter @gitit/web refresh:repos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.INDEX_GITHUB_TOKEN }}
          EMBEDDING_PROVIDER: supabase
          EMBEDDING_FUNCTION_URL: ${{ secrets.EMBEDDING_FUNCTION_URL }}
          EMBEDDING_FUNCTION_KEY: ${{ secrets.EMBEDDING_FUNCTION_KEY }}
      - name: Refresh curated skills
        run: pnpm --filter @gitit/web refresh:skills
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.INDEX_GITHUB_TOKEN }}
          EMBEDDING_PROVIDER: supabase
          EMBEDDING_FUNCTION_URL: ${{ secrets.EMBEDDING_FUNCTION_URL }}
          EMBEDDING_FUNCTION_KEY: ${{ secrets.EMBEDDING_FUNCTION_KEY }}
