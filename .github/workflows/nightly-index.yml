name: Refresh reppit index

on:
  schedule:
    - cron: "37 15 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 12.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh repository signals
        run: pnpm --filter @gitit/web refresh:repos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.INDEX_GITHUB_TOKEN }}
          EMBEDDING_PROVIDER: supabase
          EMBEDDING_FUNCTION_URL: ${{ secrets.EMBEDDING_FUNCTION_URL }}
          EMBEDDING_FUNCTION_KEY: ${{ secrets.EMBEDDING_FUNCTION_KEY }}
      - name: Refresh curated skills
        run: pnpm --filter @gitit/web refresh:skills
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.INDEX_GITHUB_TOKEN }}
          EMBEDDING_PROVIDER: supabase
          EMBEDDING_FUNCTION_URL: ${{ secrets.EMBEDDING_FUNCTION_URL }}
          EMBEDDING_FUNCTION_KEY: ${{ secrets.EMBEDDING_FUNCTION_KEY }}
      - name: Advance vote decay and trust scores
        run: pnpm --filter @gitit/web refresh:votes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
