name: Rust API and CLI

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/cli-rs/**"
      - "packages/cli/**"
      - "scripts/package-cli-native.mjs"
      - "scripts/assemble-cli-wrapper.mjs"
      - "scripts/verify-cli-release.mjs"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/cli-rs/**"
      - "packages/cli/**"
      - "scripts/package-cli-native.mjs"
      - "scripts/assemble-cli-wrapper.mjs"
      - "scripts/verify-cli-release.mjs"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/cli typecheck
      - run: pnpm --dir packages/cli test
      - run: cargo fmt --manifest-path apps/api/Cargo.toml --check
      - run: cargo fmt --manifest-path packages/cli-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path packages/cli-rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/api/Cargo.toml
      - run: cargo test --locked --manifest-path packages/cli-rs/Cargo.toml

  cli-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cargo build --release --locked --manifest-path packages/cli-rs/Cargo.toml
